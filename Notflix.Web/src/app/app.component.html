<nav class="navbar" aria-label="Main navigation">
  <a class="navbar-button" routerLink="/home">NotFlix</a>
  @if (auth.user$ | async; as user) {
    <div class="navbar-right"><span>{{ user.userName }}</span>
      <button type="button" class="session-button" [disabled]="loggingOut$ | async" (click)="logout()">Log out</button>
    </div>
  }
</nav>
@if (error$ | async; as error) { <p class="global-error" role="alert">{{ error }}</p> }
<router-outlet />
